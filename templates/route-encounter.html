<div class="route-encounter-group" data-bind="with: encounter">
    <div class="custom-tooltip route-encounter" data-bind="event: { mouseenter: $component.placeSummary }, with: pokemonMap[name]">
        <img width="32" height="32" data-bind="attr: { src: `./pokeclicker/docs/assets/images/pokemon/${$data.id}.png` }" />
        <a href="#!" data-bind="text: $data.name, attr: { href: `#!Pokemon/${$data.name}` }"></a>
        <span class="custom-tooltip-content text-nowrap mb-1">
            <pokemon-summary params="pokemonData: $data"></pokemon-summary>
        </span>
    </div>
    <!-- ko if: hints.length -->
    <span class="route-encounter-addon" data-bind="tooltip: {
        title: hints.join('\n'),
        html: false,
        customClass: 'tooltip-multiline',
        placement: 'top',
        trigger: 'hover'
    }">🔒</span>
    <!-- /ko -->
    <!-- ko if: weight != 1 -->
    <span class="route-encounter-addon" data-bind="tooltip: {
        title: `Weight: ${weight.toLocaleString()}`,
        placement: 'top',
        trigger: 'hover'
    }">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7.25" fill="none" stroke="currentColor" stroke-width="1.25"/>
            <circle cx="8" cy="4.75" r="1"/>
            <rect x="7.25" y="6.75" width="1.5" height="5" rx="0.75"/>
        </svg>
    </span>
    <!-- /ko -->
</div>
