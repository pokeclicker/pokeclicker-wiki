name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'pages/**'
      - 'templates/**'
      - 'build/**'
      - 'index.html'
      - 'styles.css'
      - 'pokeclicker'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auto-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only run one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Ensure git submodules are initialized
        run: |
          # Sync and fetch submodules (recursive) so referenced repos are available for build
          git submodule sync --recursive || true
          git submodule update --init --recursive --remote

      - name: Build bundle
        run: npm run update

      - name: Enumerate wiki routes
        run: node build/dump-routes.js

      - name: Generate static site
        run: node build/generate-static.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
