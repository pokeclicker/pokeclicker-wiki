<!-- ko with: GameHelper.enumNumbers(BerryType).filter((c) => c != -1) -->
<div class="mt-3" data-bind="if: $data.length">
    <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover">
            <thead>
                <th>Berry</th>
                <th>Farm Points per Second</th>
                <th>Total berries per harvest</th>
                <th>Total Farm Point per harvest</th>
                <th>Total time till ripe (hh:mm:ss)</th>
            </thead>
            <tbody data-bind="foreach: $data">
                <!-- ko with: BerryList[$data] -->
                <tr>
                    <td>
                        <a class="text-decoration-none" href="#!" data-bind="text: BerryType[$data.type], attr: { href: `#!Berries/${BerryType[$data.type]}` }"></a>
                    </td>
                    <td data-bind="attr: { 'data-sort': $data.farmValue / $data.growthTime[PlotStage.Bloom] }">
                        <img src="./images/farmPoint.svg" width="18px"/>
                        <ko data-bind="text: ($data.farmValue / $data.growthTime[PlotStage.Bloom]).toLocaleString(undefined, {minimumFractionDigits: 3, maximumFractionDigits: 3})"></ko>
                    </td>
                    <td data-bind="text: `${$data.harvestAmount.toLocaleString()} berr${$data.harvestAmount === 1 ? 'y' : 'ies'}`, attr: { 'data-sort': $data.harvestAmount }"></td>
                    <td data-bind="attr: { 'data-sort': $data.farmValue }">
                        <img src="./images/farmPoint.svg" width="18px"/>
                        <ko data-bind="text: $data.farmValue.toLocaleString()"></ko>
                    </td>
                    <td data-bind="text: GameConstants.formatTime($data.growthTime[PlotStage.Bloom])"></td>
                </tr>
                <!-- /ko -->
            </tbody>
        </table>
    </div>
</div>
<!-- /ko -->
