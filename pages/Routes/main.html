<!-- ko ifnot: Routes.regionRoutes.find(r => r.routeName == Wiki.pageName()) -->
<h2>Route not found...</h2>
<!-- /ko -->
<div data-bind="with: Routes.regionRoutes.find(r => r.routeName == Wiki.pageName())">
    <div class="float-lg-end col-lg-4 m-2" data-bind="pageSidebar">
        <div class="d-flex justify-content-between mb-1" data-bind="using: Routes.regionRoutes.find(r => r.routeName == Wiki.pageName())">
            <div data-bind="with: Routes['regionRoutes'][Routes['regionRoutes'].findIndex(route => route.routeName === Wiki.pageName()) -1]">
                <button class="btn btn-link btn-sm" type="button" style="text-decoration: none;"
                        data-bind="text: `← ${$data.routeName}`, click: () => Wiki.gotoPage('Routes', $data.routeName)"></button>
            </div>
            <div data-bind="with:  Routes['regionRoutes'][Routes['regionRoutes'].findIndex(route => route.routeName === Wiki.pageName()) +1]">
                <button class="btn btn-link btn-sm" type="button" style="text-decoration: none;"
                        data-bind="text: `${$data.routeName}  →`, click: () => Wiki.gotoPage('Routes', $data.routeName)"></button>
            </div>
        </div>
        <table class="table table-hover table-striped table-bordered">
            <thead>
                <tr>
                    <th class="text-center" colspan="2" data-bind="text: Wiki.pageName()"></th>
                </tr>
            </thead>
            <tbody>
                <!-- ko with: Wiki.gameHelper.getRouteOverlaySVG($data.number, $data.region, $data.subRegion ?? 0), as: 'filePath' -->
                <tr data-bind="with: Wiki.gameHelper.overlaySVG(), as: 'overlaySVG'">
                    <td colspan="2">
                        <div id="map-container">
                            <div id="map-overlay" data-bind="html: overlaySVG"></div>
                            <img class="w-100" width="1600" data-bind="attr: {
                src:`images/${filePath}.png`
              }" />
                        </div>
                    </td>
                </tr>
                <!-- /ko -->
                <tr>
                    <td>Region</td>
                    <td>
                        <a href="#!" data-bind="text: GameConstants.camelCaseToString(GameConstants.Region[$data.region]), attr: { href: `#!Regions/${GameConstants.camelCaseToString(GameConstants.Region[$data.region])}` }"></a>
                    </td>
                </tr>
                <tr>
                    <td>Sub Region</td>
                    <td data-bind="text: SubRegions.list[$data.region][$data.subRegion ?? 0].name"></td>
                </tr>
                <tr>
                    <td>Environment</td>
                    <td data-bind="foreach: MapHelper.getEnvironments($data.number, $data.region)">
                        <a href="#!" data-bind="text: GameConstants.camelCaseToString($data), attr: { href: `#!Environments/${GameConstants.camelCaseToString($data)}` }"></a><br />
                    </td>
                </tr>
                <tr>
                    <td>Base HP</td>
                    <td data-bind="text: Math.round(PokemonFactory.routeHealth($data.number, $data.region)).toLocaleString()"></td>
                </tr>
                <tr>
                    <td>Level</td>
                    <td data-bind="text: Math.round(PokemonFactory.routeLevel($data.number, $data.region)).toLocaleString()"></td>
                </tr>
                <tr>
                    <td>Egg Steps</td>
                    <td data-bind="text: +Math.sqrt(MapHelper.normalizeRoute($data.number, $data.region)).toFixed(2)"></td>
                </tr>
                <tr>
                    <td>Roamer Chance</td>
                    <td data-bind="text: `1/${Wiki.pokemon.getRouteRoamingChance($data.region, $data.subRegion ?? 0, $data.number).toLocaleString()}`"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div>
        <h3>Encounters</h3>
        <!-- ko foreach: Wiki.routes.getRouteEncounterGroups($data) -->
        <h4 class="mt-3 mb-2" data-bind="text: $data.title"></h4>
        <!-- ko if: $data.note -->
        <div class="small text-muted mb-1" data-bind="text: $data.note"></div>
        <!-- /ko -->
        <div class="d-flex flex-wrap gap-2" data-bind="foreach: $data.pokemon">
            <route-encounter params="encounter: $data"></route-encounter>
        </div>
        <!-- /ko -->
    </div>
</div>
